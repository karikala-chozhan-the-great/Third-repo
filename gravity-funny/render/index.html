<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gravity reel renderer</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="core.js"></script>
<script src="kit2.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
<script>
  window.GR.ctx = document.getElementById('c').getContext('2d', { alpha: false });
  window.GR.draw = t => window.GR.render(window.GR.ctx, t);
</script>
</body>
</html>
